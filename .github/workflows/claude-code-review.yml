# Independent review of every pull request by Claude, running on GitHub's
# infrastructure — outside the local Claude Code session that wrote the code.
#
# Why this exists (D28): the code in this repository is written by a coding
# agent, so every PR gets a second reader that had no part in writing it.
# The summary lands in the comment the action itself creates on the PR
# (track_progress) and findings as inline comments; neither blocks the
# merge — the author decides.
#
# How the review is built (#61). Until now the prompt below called the
# `code-review` plugin, and the cost would not come down: `--model` only
# picks the orchestrator, while the plugin launches its own pipeline of
# eight agents — four of them parallel reviewers, two on Opus — with the
# models hard-coded inside the plugin. We could not tune that from here,
# and the run overshot `--max-turns 15` on every PR with code in it
# (22 turns on #62, 17 on #63), so the job went red after publishing a
# perfectly good review.
#
# So the review is ours now: three review agents defined as files in
# `.claude/agents/`, which `actions/checkout` puts on the runner, plus the
# orchestrator prompt below. Each agent names its own model in its own
# frontmatter (D26), where it can be read and changed like any other file
# in the repository:
#
#   pr-correctness — Opus: logic, edge cases, error handling, tests
#   pr-security    — Sonnet: secrets, new dependencies, network, files, shell
#   pr-standards   — Sonnet: DECISIONS.md, one topic per PR (D29), description
#
# The orchestrator spawns them with the `Agent` tool (renamed from `Task` in
# CLI 2.1.63), deduplicates what they return, and does the publishing itself.
# The publishing is deliberately not left to the agents: the action buffers
# inline comments and filters out ones that look like a subagent's test
# probes (`classify_inline_comments`, on by default), so findings posted by a
# subagent could be dropped. One publisher also means one voice in the PR.
# The same filter is why the prompt below has the orchestrator pass
# `confirmed: true` on every inline comment — an optional parameter of the
# action's own inline-comment tool (`src/mcp/github-inline-comment-server.ts`)
# that posts immediately instead of going through that classification.
#
# Cost (#61): to be measured on the first PRs after this change and recorded
# in `docs/CURRENT_STATE.md`, against the plugin's $0.70 on #60. Three agents
# on a 30–100-line diff should cost a fraction of eight, but that is a
# prediction until it is measured.
#
# Every PR is reviewed, including documentation-only ones: a wrong decision
# written into `docs/` is worth catching as much as a wrong line of code, and
# a docs PR is cheap to review (#64 stayed within the turn limit).
#
# Authentication: the CLAUDE_CODE_OAUTH_TOKEN repository secret, generated by
# the author with `claude setup-token`. Reviews then draw on the Claude
# subscription instead of separate API billing. The secret is set by hand in
# GitHub → Settings → Secrets; it never appears in this repository.
#
# On a public repository GitHub withholds secrets from fork PRs, so this runs
# only for branches inside the repository itself — which is how we work (D21).
#
# Changing THIS file is never verified by the pull request that changes it.
# The action refuses to run when the workflow in the branch differs from the
# one on the default branch ("Workflow validation failed. The workflow file
# must exist and have identical content to the version on the repository's
# default branch"), because otherwise a pull request could rewrite the
# reviewer's prompt and have it run with access to the token. So a change
# here shows its first real run on the NEXT pull request after it is merged —
# plan on watching that one.

name: Claude Code Review

on:
  pull_request:
    # `synchronize` is here on purpose: a push that fixes findings is exactly
    # where new mistakes get made, so it gets its own independent review, not
    # only the local one from /review-pr. Leaving it out was a cost measure
    # from #56, lifted now that a run is our own three agents instead of the
    # plugin's eight.
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time; a new push cancels a review still running on
# the previous commit, which would otherwise comment on code already gone.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # write: the action creates the tracking comment and the model fills
      # it; inline findings are PR review comments.
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # The agents read the diff through `gh pr diff`, not through git
          # history, so a shallow clone is enough; what checkout is needed
          # for is the repository's own files — `.claude/agents/`, CLAUDE.md,
          # docs/DECISIONS.md — which the agents read as their criteria.
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action creates a comment on the PR before the model starts
          # and hands it the `mcp__github_comment__update_claude_comment`
          # tool to fill that comment in. Until #53 the summary depended on
          # `gh pr comment` from inside the run, which never showed up.
          track_progress: true
          prompt: |
            You are the review orchestrator for pull request
            #${{ github.event.pull_request.number }} of
            ${{ github.repository }}. You do not review the code yourself.
            Your job is to run three review agents, merge what they report,
            and publish it.

            1. Read the pull request: `gh pr view ${{ github.event.pull_request.number }}`
               for the description, `gh pr diff ${{ github.event.pull_request.number }}`
               for the change. If the description references an issue, read it
               with `gh issue view`.

            2. Spawn all three agents with the Agent tool, in a single
               message so they run in parallel: `pr-correctness`,
               `pr-security`, `pr-standards`. Give each of them the pull
               request number and tell it to read the diff itself. Do not
               summarise the diff for them — each agent must read the real
               change, or its review is about your summary rather than the
               code.

            3. Merge their findings. Drop duplicates — the same point on the
               same file and line — keeping the fullest explanation. Drop
               anything about formatting, style, or what typecheck already
               catches. Keep every finding you do not have a concrete reason
               to drop: your job is not to filter the review down.

            4. Post every `must-fix` and `should-fix` finding as an inline
               comment with `mcp__github_inline_comment__create_inline_comment`,
               passing `path` (the file), `line` (the line in the new
               version), `side: "RIGHT"`, `body` (the finding: its summary,
               then the full explanation) and `confirmed: true`. Always pass
               `confirmed: true`: without it the comment is buffered and
               classified after the session, and a real finding can be
               dropped as a test probe. Findings marked `note`, and findings
               about the pull request description rather than a file, stay in
               the summary only.

            5. Write the summary into your tracking comment with
               `mcp__github_comment__update_claude_comment`, in English, in
               this order:
               - What this change does and why, in plain language, explained
                 from first principles rather than assuming the reader knows
                 this code.
               - Every new dependency it adds and why each one is
                 trustworthy — or state plainly that it adds none.
               - One concrete way to verify the change by hand: run this,
                 see that.
               - Findings, grouped as Must fix / Should fix / Notes, each
                 naming its file and line. Where an agent found nothing, say
                 what it checked.
               - Which three agents ran and on which models.

            Never say the pull request is approved or rejected, and never
            ask for changes before merge: no reviewer blocks a merge in this
            project — the author reads the review and decides (D28).
          # --allowedTools: everything the run needs, and nothing else —
          #   what is not listed here is silently refused, which is how an
          #   earlier version of this workflow ended with no comment at all
          #   (#45). `Agent` is what spawns the review agents; without it
          #   there is no multi-agent review, and the failure looks like a
          #   review that simply found nothing. Read/Grep/Glob let the
          #   agents read the repository files they judge by. The `gh`
          #   commands read the PR, its diff and the linked issue. The two
          #   MCP tools publish: inline findings and the summary comment.
          #   Permission rules apply to the agents too, so the tools they
          #   need are listed here and not only in their own frontmatter.
          # --model: Sonnet for the orchestrator — it reads the diff, calls
          #   three agents and writes a summary; depth is the agents' job,
          #   and pr-correctness has Opus for it (D26).
          # --max-turns 25: reading the PR, one parallel spawn of three
          #   agents, then one turn per inline comment plus the summary. The
          #   old cap of 15 was set for a single-pass review and was the
          #   reason the job went red after publishing.
          claude_args: |
            --allowedTools "Agent,Read,Grep,Glob,mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)"
            --model claude-sonnet-5
            --max-turns 25

      # Keep the run's own transcript. Without this step a failed review is
      # a black box: the job log shows the session starting and its final
      # `result` line, and nothing in between — no tool calls, no agent
      # results. That is exactly how the runs on #66 were misread as "the
      # agents never started", when `modelUsage` in fact listed Opus, the
      # model only `pr-correctness` uses. The action writes the full
      # transcript on the runner and reports its path as `execution_file`;
      # the runner is then thrown away, so we upload the file as an
      # artifact and can read what the agents returned and where the
      # orchestrator stopped.
      #
      # `if: always()` because the interesting runs are the ones that fail.
      # The transcript holds the prompt, the PR diff and the review — all
      # of it already public in this repository — and no secrets: the token
      # is passed to the action as an input, not through the model. Artifacts
      # of a public repository are downloadable by anyone, so nothing that
      # is not already public may be added to this file later.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-review-transcript-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ steps.claude.outputs.execution_file }}
          # Long enough to look at a review after a weekend, short enough
          # not to pile up: this is a debugging aid, not a record.
          retention-days: 14
          # A run that never got as far as writing the file should not paint
          # the job with a warning annotation; the missing artifact is the
          # signal.
          if-no-files-found: warn
