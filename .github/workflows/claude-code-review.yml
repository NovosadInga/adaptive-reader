# Independent review of every pull request by Claude, running on GitHub's
# infrastructure — outside the local Claude Code session that wrote the code.
#
# Why this exists (D28): the code in this repository is written by a coding
# agent, so every PR gets a second reader that had no part in writing it.
# The summary lands as a PR comment and findings as inline comments; neither
# blocks the merge — the author decides.
#
# Authentication: the CLAUDE_CODE_OAUTH_TOKEN repository secret, generated by
# the author with `claude setup-token`. Reviews then draw on the Claude
# subscription instead of separate API billing. The secret is set by hand in
# GitHub → Settings → Secrets; it never appears in this repository.
#
# On a public repository GitHub withholds secrets from fork PRs, so this runs
# only for branches inside the repository itself — which is how we work (D21).

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time; a new push cancels the review of the old one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # write: the summary lands as a PR comment via `gh pr comment`.
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --allowedTools: exactly the set the plugin's own command declares
          #   in its `allowed-tools` front matter (plugins/code-review/commands/
          #   code-review.md). `gh pr view`/`diff` read the PR, `gh issue …`
          #   read the linked issue, `gh pr comment` posts the summary, and
          #   the MCP tool posts inline findings — the action starts that MCP
          #   server only when this flag names it. Anything not listed is
          #   silently refused, which is how the review used to end with no
          #   comment at all (#45).
          # --max-turns caps the cost of a single review.
          # --append-system-prompt: project standard (D28) — every change is
          #   explained in full, and dependencies get the closest look.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
            --max-turns 30
            --append-system-prompt "This repository's code is written by a coding agent and reviewed by its author, who expects to understand every change end to end. Open the summary comment with: what this change does and why, which new dependencies it adds and why each is trustworthy, and one concrete way to verify it works by hand. Then list findings. Explain from first principles rather than assuming context. Treat any new dependency, any network call, any file-system or shell access, and anything touching secrets or environment variables as high priority to explain."
