# Independent review of every pull request by Claude, running on GitHub's
# infrastructure — outside the local Claude Code session that wrote the code.
#
# Why this exists (D28): the code in this repository is written by a coding
# agent, so every PR gets a second reader that had no part in writing it.
# The summary lands in the comment the action itself creates on the PR
# (track_progress) and findings as inline comments; neither blocks the
# merge — the author decides.
#
# Cost (#53): one review per PR, not one per push — `synchronize` is left
# out on purpose. Fixes pushed after a review are re-checked locally by
# /review-pr (D28), so nothing goes unreviewed; the GitHub reviewer just
# stops paying for the same PR twice. Sonnet and a lower turn cap keep a
# single run cheap; PRs are small by design (D29).
#
# Authentication: the CLAUDE_CODE_OAUTH_TOKEN repository secret, generated by
# the author with `claude setup-token`. Reviews then draw on the Claude
# subscription instead of separate API billing. The secret is set by hand in
# GitHub → Settings → Secrets; it never appears in this repository.
#
# On a public repository GitHub withholds secrets from fork PRs, so this runs
# only for branches inside the repository itself — which is how we work (D21).

name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

# One review per PR at a time; reopening cancels a review still running.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # write: the action creates the tracking comment and the model fills
      # it; inline findings are PR review comments.
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action creates a comment on the PR before the model starts
          # and hands it the `mcp__github_comment__update_claude_comment`
          # tool to fill that comment in. Until #53 the summary depended on
          # `gh pr comment` from inside the run, which never showed up.
          track_progress: true
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --allowedTools: the set the plugin's own command declares in its
          #   `allowed-tools` front matter (plugins/code-review/commands/
          #   code-review.md) plus the tracking-comment tool. `gh pr view`/
          #   `diff` read the PR, `gh issue …` read the linked issue, the
          #   inline-comment MCP tool posts findings, the comment MCP tool
          #   writes the summary. With track_progress the action passes its
          #   own --allowedTools first and appends ours; the comment tool is
          #   repeated here so the summary works whichever list the CLI
          #   honours, and because the action starts an MCP server only when
          #   a flag names one of its tools. Anything not listed is silently
          #   refused, which is how the review used to end with no comment
          #   at all (#45).
          # --model: Sonnet — a review of a small diff does not need Opus,
          #   and it is several times cheaper per token (D26).
          # --max-turns caps the cost of a single review; 15 is enough for
          #   a one-topic PR (D29).
          # --append-system-prompt: project standard (D28) — every change is
          #   explained in full, and dependencies get the closest look.
          claude_args: |
            --allowedTools "mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
            --model claude-sonnet-5
            --max-turns 15
            --append-system-prompt "This repository's code is written by a coding agent and reviewed by its author, who expects to understand every change end to end. Open the summary comment with: what this change does and why, which new dependencies it adds and why each is trustworthy, and one concrete way to verify it works by hand. Then list findings. Explain from first principles rather than assuming context. Treat any new dependency, any network call, any file-system or shell access, and anything touching secrets or environment variables as high priority to explain."
